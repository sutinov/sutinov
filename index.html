<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1A33" />
    <meta name="description" content="Blagoj Sutinov — Software Developer (Java, Spring Boot, Angular, Azure). An interactive 3D blueprint CV." />
    <meta property="og:title" content="Blagoj Sutinov — Blueprint CV" />
    <meta property="og:description" content="Software Developer · Java, Spring Boot, Angular & Azure. An interactive 3D blueprint CV." />
    <meta property="og:type" content="website" />
    <title>Blagoj Sutinov — Blueprint CV</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app" class="bp-root">
      <div class="bp-wrap">
        <header class="bp-head">
          <div class="bp-head-id">
            <h1 class="bp-h1">Blagoj Sutinov</h1>
            <div class="bp-role">&gt; <span class="bp-role-text">Software Developer</span><span class="caret">_</span></div>
          </div>
          <div class="bp-hint" aria-hidden="true">
            <span class="bp-hint-row"><span class="bp-hint-dot"></span>HOVER A ZONE — IT RISES</span>
            <span>CLICK TO OPEN THAT SHEET</span>
          </div>
        </header>

        <div class="bp-stage">
          <canvas class="bp-gl" aria-hidden="true"></canvas>
          <div class="bp-spinner" role="status">
            <span class="bp-spinner-ring" aria-hidden="true"></span>
            <span class="bp-spinner-text">LOADING PLAN</span>
          </div>
          <div class="bp-sr"></div>
        </div>

        <div class="bp-vctl">
          <div class="bp-vzoom">
            <span class="bp-vlevel">×1.0</span>
            <input class="bp-vslider" type="range" min="1" max="3" step="0.05" value="1" aria-label="Zoom the blueprint" />
            <button type="button" class="bp-vbtn" aria-label="Reset the view" disabled>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <circle cx="8" cy="8" r="4.5" />
                <path d="M8 0v4M8 12v4M0 8h4M12 8h4" />
              </svg>
            </button>
          </div>
          <div class="bp-vstick" role="group" tabindex="0" aria-label="Move the blueprint: drag the stick or use the arrow keys">
            <span class="bp-vknob"></span>
          </div>
        </div>

        <nav class="bp-mnav" aria-label="CV sheets"></nav>
      </div>
      <div class="bp-vig" aria-hidden="true"></div>
    </main>

    <noscript>
      <p style="padding: 24px; font-family: sans-serif; color: #f2efe6">
        This interactive CV needs JavaScript. Contact: bsutinov@gmail.com
      </p>
    </noscript>

    <script src="js/vendor/three.bundle.js"></script>
    <script src="js/data.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
